<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>pwhoae AI Portfolio</title>

<!-- ====== STYLE ====== -->
<style>
/* RESET */
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"Segoe UI",sans-serif;
  background:#ffffff;
  overflow:hidden;
}

:root{
  --pink:#ff4fa3;
  --blue:#00cfff;
  --purple:#7a5cff;
  --bg:#ffffff;
}

/* ===== PPT SYSTEM ===== */
.slide{
  width:100vw;
  height:100vh;
  position:absolute;
  top:0;
  left:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  opacity:0;
  transform:translateX(100%);
  transition:all 1s cubic-bezier(.77,0,.175,1);
}

.slide.active{
  opacity:1;
  transform:translateX(0);
}

.slide.prev{
  transform:translateX(-100%);
}

/* ===== TYPO ===== */
h1{
  font-size:70px;
  background:linear-gradient(45deg,var(--pink),var(--blue));
  -webkit-background-clip:text;
  color:transparent;
}

.subtitle{
  font-size:20px;
  color:#666;
  margin-top:10px;
}

/* ===== CARD SYSTEM ===== */
.container{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
  margin-top:40px;
  perspective:1200px;
}

.card{
  width:250px;
  height:150px;
  background:rgba(255,255,255,0.6);
  backdrop-filter:blur(20px);
  border-radius:20px;
  padding:20px;
  box-shadow:0 20px 60px rgba(0,0,0,0.15);
  transform:translateY(80px) rotateX(20deg);
  opacity:0;
  transition:all .8s ease;
}

.card.show{
  transform:translateY(0) rotateX(0);
  opacity:1;
}

.card:hover{
  transform:rotateY(15deg) rotateX(10deg) scale(1.08);
}

/* ===== FLOAT BG ===== */
.bg{
  position:absolute;
  width:100%;
  height:100%;
  overflow:hidden;
  z-index:-1;
}

.circle{
  position:absolute;
  border-radius:50%;
  background:linear-gradient(var(--pink),var(--blue));
  opacity:.15;
  animation:float 12s infinite ease-in-out;
}

@keyframes float{
  0%{transform:translateY(0)}
  50%{transform:translateY(-40px)}
  100%{transform:translateY(0)}
}

/* ===== PROGRESS ===== */
.progress{
  position:fixed;
  top:0;
  left:0;
  height:4px;
  background:linear-gradient(90deg,var(--pink),var(--blue));
  width:0%;
}

/* ===== NAV ===== */
.nav{
  position:fixed;
  bottom:30px;
}

button{
  padding:12px 22px;
  border:none;
  border-radius:30px;
  background:var(--pink);
  color:white;
  margin:5px;
  cursor:pointer;
}

</style>
</head>

<body>

<div class="progress" id="progress"></div>

<!-- FLOAT BG -->
<div class="bg">
  <div class="circle" style="width:200px;height:200px;top:10%;left:10%"></div>
  <div class="circle" style="width:300px;height:300px;top:60%;left:70%"></div>
  <div class="circle" style="width:150px;height:150px;top:40%;left:40%"></div>
</div>

<!-- ===== SLIDES ===== -->

<div class="slide active">
  <h1 id="typing"></h1>
  <div class="subtitle">AI Engineer / Builder</div>
</div>

<div class="slide">
  <h1>About Me</h1>
  <div class="container">
    <div class="card">HKUST CPEG</div>
    <div class="card">AI + Systems</div>
    <div class="card">Edge AI Focus</div>
  </div>
</div>

<div class="slide">
  <h1>Tech Stack</h1>
  <div class="container">
    <div class="card">Python</div>
    <div class="card">C++</div>
    <div class="card">MySQL</div>
    <div class="card">Linux</div>
    <div class="card">Git</div>
  </div>
</div>

<div class="slide">
  <h1>Projects</h1>
  <div class="container">
    <div class="card">UST Simulator</div>
    <div class="card">Search Engine</div>
    <div class="card">Posture AI</div>
  </div>
</div>

<div class="slide">
  <h1>Connect</h1>
  <div class="container">
    <div class="card">GitHub</div>
    <div class="card">LinkedIn</div>
  </div>
</div>

<!-- NAV -->
<div class="nav">
  <button onclick="prevSlide()">Prev</button>
  <button onclick="toggleAuto()">Pause</button>
  <button onclick="nextSlide()">Next</button>
</div>

<!-- ===== SCRIPT ===== -->
<script>
let slides=document.querySelectorAll('.slide');
let index=0;
let auto=true;
let duration=5000;
let progress=document.getElementById('progress');

function showSlide(i){
  slides.forEach((s,idx)=>{
    s.classList.remove('active','prev');
    if(idx===i){
      s.classList.add('active');
      animate(s);
    }
    if(idx<i)s.classList.add('prev');
  })
}

function nextSlide(){
  index=(index+1)%slides.length;
  showSlide(index);
  resetProgress();
}

function prevSlide(){
  index=(index-1+slides.length)%slides.length;
  showSlide(index);
  resetProgress();
}

function animate(slide){
  let cards=slide.querySelectorAll('.card');
  cards.forEach((c,i)=>{
    c.classList.remove('show');
    setTimeout(()=>c.classList.add('show'),i*200);
  })
}

// typing
const text="Hey, I'm pwhoae 👋";
let i=0;
function type(){
  if(i<text.length){
    document.getElementById('typing').innerHTML+=text.charAt(i);
    i++;
    setTimeout(type,60);
  }
}
type();

// progress bar
function startProgress(){
  progress.style.transition='none';
  progress.style.width='0%';
  setTimeout(()=>{
    progress.style.transition=`width ${duration}ms linear`;
    progress.style.width='100%';
  },50);
}

function resetProgress(){
  startProgress();
}

setInterval(()=>{
  if(auto)nextSlide();
},duration);

function toggleAuto(){
  auto=!auto;
}

// keyboard
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')nextSlide();
  if(e.key==='ArrowLeft')prevSlide();
})

startProgress();

</script>

</body>
</html>
